[package]
name = "caching_strategies"
version = "0.1.0"
edition = "2021"
description = "Cross-block witness delta compression simulation for stateless Ethereum clients"
license = "MIT"

[[bin]]
name = "cstrat"
path = "src/main.rs"

[lib]
name = "caching_strategies"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
indexmap = "2"
arrow = "53"
parquet = { version = "53", features = ["arrow", "snap"] }
anyhow = "1"
thiserror = "2"
indicatif = "0.17"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "cache_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
