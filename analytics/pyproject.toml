[project]
name = "analytics"
version = "0.1.0"
description = "Dataset characterization and result analysis for the stateless-Ethereum witness-cache study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "msgpack>=1.0",
    "zstandard>=0.22",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics_lib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
