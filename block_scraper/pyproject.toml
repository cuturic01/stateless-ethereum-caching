[project]
name = "block-scraper"
version = "0.1.0"
description = "Fetch Ethereum mainnet block read/write traces (prestateTracer) for stateless-Ethereum witness-cache simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "tenacity>=8.2",
    "msgpack>=1.0",
    "zstandard>=0.22",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "orjson>=3.10",
]

[project.scripts]
scraper = "scraper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
